[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-markdown-converter"
version = "0.1.0"
description = "Local-first tool to convert PDF documents into structured Markdown and styled HTML5."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Pedro" }
]
dependencies = [
    "pymupdf>=1.23.0",
    "pytesseract>=0.3.10",
    "markdown>=3.5.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pdf-to-markdown = "pdf_to_markdown_converter.cli.main:main"
pdf-to-markdown-gui = "pdf_to_markdown_converter.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
